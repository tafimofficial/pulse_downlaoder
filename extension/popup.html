<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PulseDL Turbo Grabber</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      background: #080a09;
      color: #f0fdf4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1a2920;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      color: #00ff66;
      font-size: 18px;
    }
    .badge-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #111a14;
      border: 1px solid #1e3a27;
      color: #94a3b8;
    }
    .badge-status.online {
      color: #00ff66;
      border-color: rgba(0, 255, 102, 0.4);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
    }
    .badge-status.online .status-dot {
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #4ade80;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .card {
      background: #0f1411;
      border: 1px solid #1c2620;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .toggle-row:not(:last-child) {
      border-bottom: 1px solid #17211a;
      margin-bottom: 6px;
    }
    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      color: #e2e8f0;
    }
    .toggle-sub {
      font-size: 10px;
      color: #94a3b8;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #27352b;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00ff66;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
      background-color: #050806;
    }
    .btn-action {
      width: 100%;
      background: #00ff66;
      color: #050806;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-action:hover {
      background: #39ff14;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
    }
    .btn-action:active {
      transform: scale(0.98);
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span>PulseDL</span>
    </div>
    <div class="badge-status" id="engine-status">
      <span class="status-dot"></span>
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <div class="section-title">Integration Controls</div>
  <div class="card">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Floating Video Grabber</div>
        <div class="toggle-sub">Shows "Download this video" button</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-floating-btn" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Intercept Downloads</div>
        <div class="toggle-sub">Route browser files to PulseDL</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-intercept" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button class="btn-action" id="btn-download-tab">
    <span>⚡</span>
    <span>Download Current Page Video</span>
  </button>

  <div class="footer">
    PulseDL Turbo v1.0 • 99% Bandwidth Saturation Active
  </div>

  <script src="popup.js"></script>
</body>
</html>
